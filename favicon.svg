<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9B0"/>
      <stop offset="0.45" stop-color="#FFC857"/>
      <stop offset="1" stop-color="#FF7A00"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F3D5E"/>
      <stop offset="1" stop-color="#15709a"/>
    </linearGradient>
    <clipPath id="r"><rect x="0" y="0" width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="64" height="64" fill="#0e0d0f"/>
    <!-- sky glow -->
    <rect width="64" height="40" fill="#1c1410"/>
    <!-- sun -->
    <circle cx="32" cy="34" r="15" fill="url(#sun)"/>
    <!-- sea -->
    <rect x="0" y="40" width="64" height="24" fill="url(#sea)"/>
    <!-- horizon highlight -->
    <rect x="0" y="40" width="64" height="2" fill="#FFC857" opacity="0.7"/>
    <!-- sun reflection -->
    <rect x="28" y="42" width="8" height="20" fill="#FFC857" opacity="0.35"/>
  </g>
</svg>
